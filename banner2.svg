<svg xmlns="http://www.w3.org/2000/svg" width="600" height="60" viewBox="0 0 600 60">
  <style>
    @keyframes typing {
      0%, 10% { width: 0; }
      70%, 90% { width: 440px; }
      100% { width: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: 'Courier New', Consolas, Monaco, monospace;
    }
    .typewriter {
      color: #ff6b9d;
      font-size: 22px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      display: inline-block;
      animation: typing 6s steps(35, end) infinite;
    }
    .cursor {
      display: inline-block;
      width: 3px;
      height: 24px;
      background-color: #00d2d3;
      margin-left: 4px;
      animation: blink 0.8s infinite;
    }
  </style>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrapper">
      <span class="typewriter">🌸 Thanks for visiting my profile 🌸</span>
      <span class="cursor"></span>
    </div>
  </foreignObject>
</svg>
